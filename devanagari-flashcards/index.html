<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devanagari Flashcards</title>
<style>
  :root {
    --bg: #F6F4FA;
    --ink: #2F2B43;
    --muted: #7C7896;
    --line: #E7E3F2;
    --mint: #C9EBDD;
    --mint-ink: #2E7D62;
    --lav: #DCD2F7;
    --lav-ink: #5B4B8A;
    --peach: #FBD5C4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 32px;
  }
  header, .filters, .progress, .stage, .controls, footer {
    width: 100%;
    max-width: 420px;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 0; }
  .count { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .filters { display: flex; gap: 8px; margin: 18px 0 12px; flex-wrap: wrap; }
  .pill {
    border: 0; border-radius: 999px; padding: 8px 14px;
    background: #fff; color: var(--ink);
    font: inherit; font-size: .85rem; cursor: pointer;
    box-shadow: 0 1px 0 var(--line);
  }
  .pill[aria-pressed="true"] { background: var(--ink); color: #fff; }

  .progress { height: 8px; background: #E9E5F4; border-radius: 999px; overflow: hidden; }
  .progress span { display: block; height: 100%; background: var(--lav); transition: width .3s ease; }

  .stage { perspective: 1400px; aspect-ratio: 3 / 4; margin: 24px 0 20px; }
  .card {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.4, .2, .2, 1);
    cursor: pointer; border-radius: 32px;
    outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card:focus-visible .face { outline: 3px solid var(--lav-ink); outline-offset: 4px; }

  .face {
    position: absolute; inset: 0; border-radius: 32px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 24px; box-shadow: 0 12px 32px rgba(47, 43, 67, .08);
  }
  .front {
    background: var(--tint);
    justify-content: center;
  }
  .front .deva {
    font-family: "Noto Sans Devanagari", "Nirmala UI", "Kohinoor Devanagari",
                 "Devanagari Sangam MN", Mangal, sans-serif;
    font-size: clamp(7rem, 34vw, 9.5rem);
    line-height: 1.25;
    color: var(--ink);
  }
  .front .hint { position: absolute; bottom: 22px; font-size: .8rem; color: var(--muted); }

  .back {
    background: #fff; transform: rotateY(180deg);
    justify-content: center; text-align: center;
  }
  .tag {
    font-size: .72rem; border-radius: 999px; padding: 6px 12px;
    background: var(--tint); color: var(--tint-ink);
    margin-bottom: 18px;
  }
  .mini {
    font-family: "Noto Sans Devanagari", "Nirmala UI", "Kohinoor Devanagari",
                 "Devanagari Sangam MN", Mangal, sans-serif;
    font-size: 2.2rem; line-height: 1.2; color: var(--ink);
  }
  .latin { font-size: 2.8rem; font-weight: 600; color: var(--tint-ink); margin: 6px 0 2px; }
  .pron { font-size: 1rem; margin-bottom: 22px; }
  .info { font-size: .92rem; color: var(--muted); line-height: 1.7; }
  .note {
    margin-top: 20px; font-size: .8rem; color: var(--muted);
    background: var(--bg); border-radius: 16px; padding: 10px 14px; line-height: 1.5;
  }

  .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .round {
    width: 56px; height: 56px; border-radius: 50%; border: 0;
    background: #fff; color: var(--ink); font-size: 1.3rem; cursor: pointer;
    box-shadow: 0 6px 16px rgba(47, 43, 67, .08);
  }
  .wide {
    border: 0; border-radius: 999px; padding: 14px 26px;
    background: var(--peach); color: var(--ink);
    font: inherit; font-weight: 600; cursor: pointer;
    box-shadow: 0 6px 16px rgba(47, 43, 67, .08);
  }
  button:focus-visible { outline: 3px solid var(--lav-ink); outline-offset: 3px; }

  footer { text-align: center; font-size: .8rem; color: var(--muted); }

  /* Glyphs drawn from the reference images */
  .front img { height: 200px; max-width: 75%; width: auto; display: block; }
  .mini img { height: 46px; width: auto; display: block; margin: 0 auto; }

  /* Hidden surprise card */
  .is-secret .front { padding: 0; background: none; box-shadow: 0 12px 32px rgba(47, 43, 67, .14); }
  .is-secret .front img { height: 100%; width: 100%; object-fit: cover; border-radius: 32px; }
  .is-secret .tag { display: none; }
  .is-secret .latin { font-size: 2.2rem; }

  @media (prefers-reduced-motion: reduce) {
    .card, .progress span { transition: none; }
  }
</style>
</head>
<body>

<header>
  <h1>Devanagari</h1>
  <span class="count" id="count"></span>
</header>

<div class="filters" role="group" aria-label="Filter cards">
  <button class="pill" data-filter="all" aria-pressed="true">All 49</button>
  <button class="pill" data-filter="v" aria-pressed="false">Vowels 14</button>
  <button class="pill" data-filter="c" aria-pressed="false">Consonants 35</button>
  <button class="pill" id="shuffle" aria-label="Shuffle cards">Shuffle</button>
</div>

<div class="progress" aria-hidden="true"><span id="bar"></span></div>

<div class="stage">
  <div class="card" id="card" tabindex="0" role="button" aria-label="Flip card">
    <div class="face front">
      <div class="deva" id="fDeva"></div>
      <div class="hint" id="hint">Tap to flip</div>
    </div>
    <div class="face back">
      <div class="tag" id="tag"></div>
      <div class="mini" id="bDeva"></div>
      <div class="latin" id="latin"></div>
      <div class="pron" id="pron"></div>
      <div class="info" id="place"></div>
      <div class="info" id="manner"></div>
      <div class="note" id="note" hidden></div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="round" id="prev" aria-label="Previous card">&larr;</button>
  <button class="wide" id="flip">Flip</button>
  <button class="round" id="next" aria-label="Next card">&rarr;</button>
</div>

<footer>Keys: &larr; &rarr; move &middot; Space flips</footer>

<script>
const VOWEL_TAG = "MAGÁNHANGZÓ · sonans (zöngés)";
const CONS_TAG  = "MÁSSALHANGZÓ · consonans";
const TWO_FORMS = ["kha", "dha", "bha", "la"];
const TWO_FORMS_NOTE = "Ugyanaz a betű két formában, mindkettő helyes. Felül a gyakoribb, alul a ritkább alak.";

// [latin, devanagari, pronunciation, place, manner]
const DATA = [
  ["a","अ","a","torok · velaris","egyes (monophthongus) · rövid"],
  ["ā","आ","á","torok · velaris","egyes (monophthongus) · hosszú"],
  ["i","इ","i","íny · palatalis","egyes (monophthongus) · rövid"],
  ["ī","ई","í","íny · palatalis","egyes (monophthongus) · hosszú"],
  ["u","उ","u","ajak · labialis","egyes (monophthongus) · rövid"],
  ["ū","ऊ","ú","ajak · labialis","egyes (monophthongus) · hosszú"],
  ["ṛ","ऋ","ri","nyelvcsúcs · cerebralis","egyes (monophthongus) · rövid"],
  ["ṝ","ॠ","rí","nyelvcsúcs · cerebralis","egyes (monophthongus) · hosszú"],
  ["ḷ","ऌ","li","fog · dentalis","egyes (monophthongus) · rövid"],
  ["ḹ","ॡ","lí","fog · dentalis","egyes (monophthongus) · hosszú"],
  ["e","ए","é","íny · palatalis","kettős (diphthongus) · hosszú"],
  ["ai","ऐ","ai","íny · palatalis","kettős (diphthongus) · hosszú"],
  ["o","ओ","ó","ajak · labialis","kettős (diphthongus) · hosszú"],
  ["au","औ","au","ajak · labialis","kettős (diphthongus) · hosszú"],
  ["aṁ","अं","am / an","anusvāra · helye a következő hangtól függ","orrhang (nasalis) · zöngés"],
  ["ḥ","ः","h","torok · velaris","réshang (spirans) · zöngétlen"],
  ["ka","क","ka","torok · velaris","zárhang (explosiva) · zöngétlen"],
  ["kha","ख","kha","torok · velaris","zárhang (explosiva) · zöngétlen, hehezetes"],
  ["ga","ग","ga","torok · velaris","zárhang (explosiva) · zöngés"],
  ["gha","घ","gha","torok · velaris","zárhang (explosiva) · zöngés, hehezetes"],
  ["ṅa","ङ","na","torok · velaris","orrhang (nasalis) · zöngés"],
  ["ca","च","csa","íny · palatalis","zárhang (explosiva) · zöngétlen"],
  ["cha","छ","csha","íny · palatalis","zárhang (explosiva) · zöngétlen, hehezetes"],
  ["ja","ज","dzsa","íny · palatalis","zárhang (explosiva) · zöngés"],
  ["jha","झ","dzsha","íny · palatalis","zárhang (explosiva) · zöngés, hehezetes"],
  ["ña","ञ","n(y)a","íny · palatalis","orrhang (nasalis) · zöngés"],
  ["ṭa","ट","ta","nyelvcsúcs · cerebralis","zárhang (explosiva) · zöngétlen"],
  ["ṭha","ठ","tha","nyelvcsúcs · cerebralis","zárhang (explosiva) · zöngétlen, hehezetes"],
  ["ḍa","ड","da","nyelvcsúcs · cerebralis","zárhang (explosiva) · zöngés"],
  ["ḍha","ढ","dha","nyelvcsúcs · cerebralis","zárhang (explosiva) · zöngés, hehezetes"],
  ["ṇa","ण","na","nyelvcsúcs · cerebralis","orrhang (nasalis) · zöngés"],
  ["ta","त","ta","fog · dentalis","zárhang (explosiva) · zöngétlen"],
  ["tha","थ","tha","fog · dentalis","zárhang (explosiva) · zöngétlen, hehezetes"],
  ["da","द","da","fog · dentalis","zárhang (explosiva) · zöngés"],
  ["dha","ध","dha","fog · dentalis","zárhang (explosiva) · zöngés, hehezetes"],
  ["na","न","na","fog · dentalis","orrhang (nasalis) · zöngés"],
  ["pa","प","pa","ajak · labialis","zárhang (explosiva) · zöngétlen"],
  ["pha","फ","pha","ajak · labialis","zárhang (explosiva) · zöngétlen, hehezetes"],
  ["ba","ब","ba","ajak · labialis","zárhang (explosiva) · zöngés"],
  ["bha","भ","bha","ajak · labialis","zárhang (explosiva) · zöngés, hehezetes"],
  ["ma","म","ma","ajak · labialis","orrhang (nasalis) · zöngés"],
  ["ya","य","ja","íny · palatalis","folyékony (liquida) · zöngés"],
  ["ra","र","ra","nyelvcsúcs · cerebralis","folyékony (liquida) · zöngés"],
  ["la","ल","la","fog · dentalis","folyékony (liquida) · zöngés"],
  ["va","व","va","ajak · labialis","folyékony (liquida) · zöngés"],
  ["śa","श","sa","íny · palatalis","réshang (spirans) · zöngétlen"],
  ["ṣa","ष","sa","nyelvcsúcs · cerebralis","réshang (spirans) · zöngétlen"],
  ["sa","स","sza","fog · dentalis","réshang (spirans) · zöngétlen"],
  ["ha","ह","ha","torok · velaris","folyékony (liquida) · zöngés"]
];

// Every letter's front image lives in assets/glyphs/NN.png (NN = card number)
const IMAGES = {};

const cards = DATA.map((row, i) => ({
  n: i + 1,
  latin: row[0],
  deva: row[1],
  img: IMAGES[row[0]] || `assets/glyphs/${String(i + 1).padStart(2, "0")}.png`,
  pron: row[2],
  place: row[3],
  manner: row[4],
  vowel: i < 14,
  twoForms: TWO_FORMS.includes(row[0])
}));

// Easter egg: a surprise card at the end of the full deck
const SECRET = {
  secret: true,
  latin: "manohara",
  deva: "मनोहर",
  pron: "cute, charming",
  place: "संस्कृत · Sanskrit",
  manner: "Cute, charming: for this little one",
  vowel: false,
  twoForms: false
};

const $ = (id) => document.getElementById(id);
const card = $("card");
let filter = "all";
let list = [];
let pos = 0;

function applyFilter() {
  list = cards.filter(c => filter === "all" || (filter === "v") === c.vowel);
  if (filter === "all") list = list.concat([SECRET]);
  pos = 0;
  render();
}

// Shows a letter as an image if one is mapped, otherwise as font text
function showGlyph(el, c, isBack) {
  el.textContent = "";
  if (c.secret && !isBack) {
    const img = document.createElement("img");
    img.src = "assets/dog.png";
    img.alt = "Shiba Inu puppy";
    el.appendChild(img);
  } else if (c.img) {
    const img = document.createElement("img");
    img.src = c.img;
    img.alt = c.latin;
    el.appendChild(img);
  } else {
    el.textContent = c.deva;
  }
}

function render() {
  const c = list[pos];
  if (!c) return;

  card.classList.remove("flipped");
  card.classList.toggle("is-secret", !!c.secret);
  card.style.setProperty("--tint", c.vowel ? "var(--mint)" : "var(--lav)");
  card.style.setProperty("--tint-ink", c.vowel ? "var(--mint-ink)" : "var(--lav-ink)");

  showGlyph($("fDeva"), c);
  showGlyph($("bDeva"), c, true);
  $("hint").hidden = !!c.secret;
  $("tag").textContent = c.secret ? "" : `${c.vowel ? VOWEL_TAG : CONS_TAG} ${c.n}`;
  $("latin").textContent = c.latin;
  $("pron").textContent = c.secret ? c.pron : `ejtsd: ${c.pron}`;
  $("place").textContent = c.place;
  $("manner").textContent = c.manner;

  const note = $("note");
  note.hidden = !c.twoForms;
  note.textContent = c.twoForms ? TWO_FORMS_NOTE : "";

  const total = list.filter(x => !x.secret).length;
  $("count").textContent = c.secret ? "" : `${pos + 1} / ${total}`;
  $("bar").style.width = `${((pos + 1) / list.length) * 100}%`;
}

function go(step) {
  pos = (pos + step + list.length) % list.length;
  render();
}

function flip() {
  card.classList.toggle("flipped");
}

function shuffle() {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  pos = 0;
  render();
}

document.querySelectorAll(".pill[data-filter]").forEach(btn => {
  btn.addEventListener("click", () => {
    filter = btn.dataset.filter;
    document.querySelectorAll(".pill[data-filter]").forEach(b =>
      b.setAttribute("aria-pressed", String(b === btn)));
    applyFilter();
  });
});

$("shuffle").addEventListener("click", shuffle);
$("prev").addEventListener("click", () => go(-1));
$("next").addEventListener("click", () => go(1));
$("flip").addEventListener("click", flip);
card.addEventListener("click", flip);
card.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); }
});

document.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("button")) return;
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === " ") { e.preventDefault(); flip(); }
});

applyFilter();
</script>
</body>
</html>
