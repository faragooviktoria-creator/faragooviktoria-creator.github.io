<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devanāgarī kártyák</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Noto+Serif+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ebe5df; --card:#fffdfb; --ink:#1c1613; --accent:#8a2b0f; --muted:#7a6d64; --line:#e2d4cc; --shadow:0 1px 2px rgba(60,30,15,.08),0 12px 30px -12px rgba(60,30,15,.28);
  --lat:"Noto Serif",Georgia,"Times New Roman",serif; --dev:"Noto Serif Devanagari","Nirmala UI","Kohinoor Devanagari","Devanagari Sangam MN",serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16110f;--card:#241c18;--ink:#f3ebe5;--accent:#e3906b;--muted:#a8998e;--line:#3b2f29;--shadow:0 12px 30px -12px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#16110f;--card:#241c18;--ink:#f3ebe5;--accent:#e3906b;--muted:#a8998e;--line:#3b2f29;--shadow:0 12px 30px -12px rgba(0,0,0,.6)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--lat);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:10px 16px 14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-weight:400;font-size:1.05rem;color:var(--accent);margin:0;letter-spacing:.01em}
.seg{display:flex;background:var(--line);border-radius:999px;padding:3px}
.seg button{font:inherit;font-size:.85rem;border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:14px 0 10px;touch-action:pan-y}
.card{position:relative;height:100%;max-height:560px;aspect-ratio:63/92;max-width:100%;perspective:1400px;cursor:pointer;user-select:none;-webkit-user-select:none}
.inner{position:absolute;inset:0;transition:transform .5s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 18px;text-align:center;overflow:hidden}
.back{transform:rotateY(180deg)}
.num{position:absolute;top:12px;right:16px;font-size:.85rem;color:var(--muted)}
.kind{position:absolute;top:13px;left:16px;right:44px;text-align:left;font-size:.78rem;color:var(--accent);font-style:italic}
.glyph{background:var(--ink);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-position:center;mask-position:center}
.dev{font-family:var(--dev);line-height:1.25}
.big{font-size:clamp(5rem,30vw,8.5rem)}
.ia{font-size:clamp(2.6rem,12vw,3.4rem);color:var(--accent);line-height:1.1}
.ej{font-size:1.15rem;color:var(--muted);margin-top:6px}.ej b{color:var(--ink);font-weight:600}
.meta{font-size:.92rem;color:var(--muted);margin-top:22px;line-height:1.6}
.note{font-size:.85rem;color:var(--muted);margin-top:14px;font-style:italic;line-height:1.45}
.pair{display:flex;width:100%;align-items:stretch}
.pair>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pair>div+div{border-left:1px solid var(--line)}
.lab{font-size:.78rem;color:var(--accent);font-style:italic;margin-bottom:16px}
.mid{font-size:clamp(4.4rem,23vw,6.4rem)}
.none{font-size:1.05rem;color:var(--muted);font-style:italic;padding:28px 0}
.exs{margin-top:8px;font-size:.95rem;color:var(--muted);line-height:1.35}
.exs .dev{font-size:1.45rem;color:var(--ink)} .exs b{color:var(--ink);font-weight:600}
.pl{font-size:1rem;color:var(--muted);margin-top:2px}.pl .dev{font-size:1.5rem;color:var(--ink)}.pl b{color:var(--ink)}
.info{font-size:.95rem;line-height:1.55;text-align:left;color:var(--ink)}
.info table{border-collapse:collapse;margin-top:8px}.info td{padding:3px 10px 3px 0;vertical-align:middle}
.info .dev{font-size:1.4rem}
.hint{font-size:.8rem;color:var(--muted);position:absolute;bottom:12px;left:0;right:0;opacity:.8}
.slide-l{animation:sl .22s ease-out}.slide-r{animation:sr .22s ease-out}
@keyframes sl{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes sr{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav button,.opts button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;cursor:pointer}
.nav button{width:56px;height:46px;font-size:1.4rem}
.count{font-size:.95rem;color:var(--muted);font-variant-numeric:tabular-nums}
.opts{display:flex;justify-content:center;gap:8px;margin-top:10px}
.opts button{font-size:.85rem;padding:7px 12px;color:var(--muted)}
.opts button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.inner{transition:none}.slide-l,.slide-r{animation:none}}
.app.wide{max-width:980px}
@media (max-width:520px){header{flex-direction:column;align-items:stretch;gap:8px}.seg button{flex:1;padding:6px 4px;font-size:.82rem}}
[hidden]{display:none!important}
.ov{flex:1;overflow-y:auto;padding:12px 2px 16px}
.ov h2{font-weight:400;font-size:1.35rem;color:var(--accent);margin:2px 0 0;text-align:center}
.ov h3{font-weight:400;font-size:1.1rem;color:var(--accent);margin:22px 0 0;text-align:center}
.ov .sub{font-size:.82rem;color:var(--muted);text-align:center;margin:2px 0 12px}
.ov .sub b{color:var(--ink)}
.blk{border-top:1px solid var(--line);padding:6px 0}
.bl{font-size:.85rem;color:var(--accent);margin-bottom:2px}
.bl span{display:block;font-size:.75rem;font-style:italic;color:var(--muted)}
.brow{display:flex;flex-wrap:wrap;gap:0 4px;padding:4px 0;border-top:1px solid var(--line)}
.brow:first-child{border-top:none}
.cell{width:52px;text-align:center}
.cell .dv{font-family:var(--dev);font-size:1.9rem;line-height:1.3}
.cell .tt{color:var(--accent);font-size:.9rem;margin-top:-4px}
@media (min-width:700px){.blk{display:grid;grid-template-columns:170px 1fr;align-items:center}.bl{border-right:1px solid var(--line);padding-right:12px;margin:0}.brows{padding-left:12px}.cell{width:60px}.cell .dv{font-size:2.2rem}}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.ph{border-collapse:collapse;border:2.5px solid var(--accent);min-width:720px;width:100%;font-size:.82rem}
table.ph th,table.ph td{border:1px solid var(--line);padding:5px 6px;line-height:1.3}
table.ph th{font-weight:400;color:var(--accent);font-size:.75rem;text-align:center;background:color-mix(in srgb,var(--accent) 6%,var(--card))}
table.ph th span{display:block;font-style:italic;color:var(--muted)}
table.ph td{text-align:left;background:var(--card);color:var(--muted);white-space:nowrap}
table.ph td b{color:var(--ink);font-size:1.05rem}
table.ph th.rh{border-right:2.5px solid var(--accent)}
table.ph .vb{border-right:2.5px solid var(--accent)}
table.ph tr.hl th{border-bottom:2.5px solid var(--accent)}
table.ph td[data-dbl]{border:4px double var(--accent)}
.fn{font-size:.78rem;color:var(--muted);font-style:italic;margin-top:6px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Devanāgarī</h1>
    <div class="seg" role="group" aria-label="Pakli">
      <button data-deck="abc" aria-pressed="true">Ábécé</button>
      <button data-deck="mat" aria-pressed="false">Magánhangzójelek</button>
      <button data-deck="ov" aria-pressed="false">Áttekintő</button>
    </div>
  </header>
  <div class="ov" id="ov" hidden></div>
  <div class="stage" id="stage">
    <div class="card" id="card" role="button" tabindex="0" aria-label="Kártya, koppints a megfordításhoz">
      <div class="inner"><div class="face front" id="front"></div><div class="face back" id="back"></div></div>
    </div>
  </div>
  <div class="nav" id="navbar">
    <button id="prev" aria-label="Előző">‹</button>
    <span class="count" id="count"></span>
    <button id="next" aria-label="Következő">›</button>
  </div>
  <div class="opts" id="optbar">
    <button id="shuffle" aria-pressed="false">Keverés</button>
    <button id="reverse" aria-pressed="false">Átírás elöl</button>
  </div>
</div>

 = ri</td><td><b class=\"hg\">ṝ</b> = rí</td><td></td></tr><tr><th class=\"rh\">fog<span>dentalis</span></th><td><b class=\"hg\">t</b> = t</td><td><b class=\"hg\">th</b> = th</td><td><b class=\"hg\">d</b> = d</td><td><b class=\"hg\">dh</b> = dh</td><td><b class=\"hg\">n</b> = n</td><td><b class=\"hg\">l</b> = l</td><td class=vb><b class=\"hg\">s</b> = sz</td><td><b class=\"hg\">ḷ</b> = li</td><td></td><td></td></tr><tr><th class=\"rh\">ajak<span>labialis</span></th><td><b class=\"hg\">p</b> = p</td><td><b class=\"hg\">ph</b> = ph</td><td><b class=\"hg\">b</b> = b</td><td><b class=\"hg\">bh</b> = bh</td><td><b class=\"hg\">m</b> = m</td><td data-dbl=1><b class=\"hg\">v</b> = v</td><td class=vb></td><td><b class=\"hg\">u</b> = u</td><td><b class=\"hg\">ū</b> = ú</td><td><b class=\"hg\">o</b> = ó<br><b class=\"hg\">au</b> = au</td></tr></table></div><div class=\"fn\">A <b>ḹ</b> a hagyományos ábécé része, de valódi szóban nem fordul elő, ezért a táblázat nem tartalmazza.</div>"};
const INFO={t:'info'};
DATA.mat.push(INFO);
let deck='abc', order=[], pos=0, shuffled=false, reversed=false;
const $=id=>document.getElementById(id);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function glyph(c){
  const h=c.dbl?66:44;
  return `<div class="glyph" style="height:${h}%;aspect-ratio:${c.ratio};max-width:88%;-webkit-mask-image:url(${c.img});mask-image:url(${c.img})"></div>`;
}
function abcFront(c){return glyph(c)+`<div class="hint">koppints a megfordításhoz</div>`}
function abcBack(c){
  return `<span class="kind">${c.kind}</span><span class="num">${c.n}</span>
  <div class="ia">${c.ia}</div><div class="ej">ejtsd: <b>${c.ej}</b></div>
  <div class="meta"><b style="color:var(--ink);font-size:1.1rem">${c.ph}</b>: ${c.place}<br>${c.mode}</div>
  ${c.dbl?'<div class="note">Két írásmód: felül a gyakoribb, alul a ritkább alak.</div>':''}`;
}
function ex(e){return e?`<span class="dev">${e[0]}</span><br>${e[1]}`:'–'}
function matFront(c){
  if(c.t==='irr') return `<div class="dev mid">${c.g}</div>`;
  if(c.t==='info') return `<div style="font-size:1.6rem;color:var(--accent);line-height:1.3">Tudnivalók</div><div class="ej" style="margin-top:10px">a magánhangzók írásáról</div><div class="hint">koppints a megfordításhoz</div>`;
  const jel=c.j?`<div class="dev mid">${c.j}</div>`:`<div class="none" style="font-size:.95rem;line-height:1.4">a mássalhangzójel<br>tartalmazza<br>az <b>a</b> hangot</div>`;
  return `<div class="pair"><div><div class="lab">szókezdő</div><div class="dev mid">${c.ini}</div></div><div><div class="lab">szóbelseji, szóvégi</div>${jel}</div></div>`;
}
function matBack(c){
  if(c.t==='irr') return `<span class="kind">Rendhagyó alakok</span><span class="num">${c.n}</span><div class="ia" style="font-size:2.3rem">${c.ia}</div><div class="ej">ejtsd: <b>${c.ej}</b></div><div class="meta">${c.txt}</div>`;
  if(c.t==='info') return `<span class="kind">Tudnivalók</span><div class="info">
   A magánhangzóknak <b>két írott alakjuk</b> van: a <b>szókezdő</b> betű a szó elején, és a <b>magánhangzójel</b> a szó belsejében és végén. A jel a mássalhangzó <b>eredeti, vele együtt ejtendő a-ját</b> változtatja át, annak helyére lép. Az <b>a</b> hangot maga a mássalhangzójel tartalmazza, ezért annak nincs külön jele.
   <table><tr><td><b>alá:</b></td><td>u ū ṛ ṝ ḷ</td><td>pl. <span class="dev">कु</span> = k<b>u</b></td></tr>
   <tr><td><b>fölé:</b></td><td>e ai</td><td>pl. <span class="dev">के</span> = k<b>e</b></td></tr>
   <tr><td><b>után:</b></td><td>ā ī o au</td><td>pl. <span class="dev">का</span> = k<b>ā</b></td></tr>
   <tr><td><b>elé:</b></td><td>i</td><td>pl. <span class="dev">कि</span> = k<b>i</b></td></tr></table></div>`;
  return `<span class="kind">Magánhangzó és jele</span><span class="num">${c.n}</span>
   <div class="ia">${c.ia}</div><div class="ej">ejtsd: <b>${c.ej}</b></div>
   <div class="pair" style="margin-top:20px">
    <div><div class="lab">szókezdő</div><div class="exs">${ex(c.e1)}</div></div>
    <div><div class="lab">szóbelseji, szóvégi</div>${c.ia==='ḹ'?'':`<div class="pl">pl. <span class="dev">${c.k}</span> = k<b>${c.ia}</b></div>`}<div class="exs">${ex(c.e2)}</div></div>
   </div>`;
}

function renderOv(){ $('ov').innerHTML=DATA.ovhtml; }
function build(){
  const n=DATA[deck].length; order=[...Array(n).keys()];
  if(shuffled){for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}
}
function render(dir){
  const c=DATA[deck][order[pos]], card=$('card');
  let f,b; if(deck==='abc'){f=abcFront(c);b=abcBack(c)}else{f=matFront(c);b=matBack(c)}
  if(reversed){[f,b]=[b,f]}
  card.classList.remove('flipped');
  $('front').innerHTML=f; $('back').innerHTML=b;
  $('count').textContent=`${pos+1} / ${order.length}`;
  if(dir){card.classList.remove('slide-l','slide-r');void card.offsetWidth;card.classList.add(dir>0?'slide-l':'slide-r')}
  store.set('dvn-state',{deck,pos:shuffled?0:pos});
}
function go(d){pos=(pos+d+order.length)%order.length;render(d)}
function flip(){$('card').classList.toggle('flipped')}
function setDeck(d){deck=d;document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.deck===d));
  const ov=d==='ov'; $('ov').hidden=!ov; $('stage').hidden=ov; $('navbar').hidden=ov; $('optbar').hidden=ov; document.querySelector('.app').classList.toggle('wide',ov);
  if(ov){renderOv();store.set('dvn-state',{deck:'ov',pos:0});return}
  pos=0;build();render()}

document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>setDeck(b.dataset.deck)));
$('prev').onclick=()=>go(-1); $('next').onclick=()=>go(1);
$('shuffle').onclick=e=>{shuffled=!shuffled;e.currentTarget.setAttribute('aria-pressed',shuffled);pos=0;build();render()};
$('reverse').onclick=e=>{reversed=!reversed;e.currentTarget.setAttribute('aria-pressed',reversed);render()};
document.addEventListener('keydown',e=>{if(deck==='ov')return;if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);else if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}});
// swipe vs tap
let sx=0,sy=0,st=0,moved=false;
const stage=$('stage');
stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;st=Date.now();moved=false});
stage.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-sx)>10)moved=true});
stage.addEventListener('pointerup',e=>{if(deck==='ov')return;
  const dx=e.clientX-sx, dy=e.clientY-sy;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){go(dx<0?1:-1)}
  else if(!moved&&e.target.closest('.card')){flip()}
});
const saved=store.get('dvn-state');
if(saved&&saved.deck==='ov'){setDeck('ov')}
else{ if(saved&&DATA[saved.deck]&&saved.deck!=='ov'){deck=saved.deck;document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.deck===deck));build();pos=Math.min(saved.pos||0,order.length-1)}else build();
render();}
</script>
