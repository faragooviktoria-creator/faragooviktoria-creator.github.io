<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b6cb0">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Kártyás tanuló</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--text:#1d2434;--muted:#687186;--accent:#2b6cb0;--ok:#2f855a;--ok-bg:#e6f4ec;--warn:#b7791f;--border:#dfe4ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:560px;margin:0 auto;padding:16px;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:8px 0 16px}
header h1{font-size:1.3rem;margin:0;flex:1}
button{font:inherit;cursor:pointer;border:none;border-radius:12px;padding:12px 16px;background:var(--accent);color:#fff}
button:disabled{opacity:.4;cursor:default}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--border)}
button.small{padding:8px 12px;font-size:.9rem}
.cat-list{display:flex;flex-direction:column;gap:12px}
.cat{background:var(--card);color:var(--text);text-align:left;padding:18px;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--border);display:block;width:100%}
.cat h2{margin:0 0 4px;font-size:1.1rem}
.cat p{margin:0 0 10px;color:var(--muted);font-size:.9rem}
.bar{height:8px;background:#e6eaf2;border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--ok);width:0;transition:width .3s}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#e6eaf2;padding:4px;border-radius:14px;margin:12px 0}
.seg button{background:transparent;color:var(--text);padding:9px 4px;font-size:.82rem;border-radius:10px;line-height:1.2}
.seg button.active{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem;margin-top:10px}
.scene{perspective:1200px;width:100%;height:min(58vh,420px);margin:8px 0 16px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s ease;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.card.instant{transition:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:20px;box-shadow:0 6px 20px rgba(0,0,0,.08);border:1px solid var(--border);padding:44px 24px 40px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:auto}
.face.back{transform:rotateY(180deg);background:#f5f9ff}
.label{position:absolute;top:14px;left:18px;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.face p{font-size:1.2rem;line-height:1.5;margin:0}
.face.back p{font-size:1.05rem}
.badge{position:absolute;top:12px;right:14px;background:var(--ok-bg);color:var(--ok);font-size:.78rem;padding:4px 10px;border-radius:99px;font-weight:600}
.hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:.75rem;color:var(--muted)}
.controls{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}
.toggle-known{background:var(--ok)}
.toggle-known.undo{background:var(--warn)}
.footer{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:40px 16px;background:var(--card);border-radius:16px;border:1px dashed var(--border);margin-bottom:16px}
</style>
</head>
<body>
<div class="wrap">

  <!-- Kategória választó -->
  <section id="home">
    <header><h1>📚 Kártyás tanuló</h1></header>
    <div id="cat-list" class="cat-list"></div>
  </section>

  <!-- Tanulófelület -->
  <section id="study" hidden>
    <header>
      <button class="ghost small" id="back">← Témák</button>
      <h1 id="study-title"></h1>
    </header>

    <div class="bar"><div id="bar"></div></div>
    <div class="meta"><span id="progress-text"></span><span id="counter"></span></div>

    <div class="seg">
      <button data-filter="all" id="f-all">Mind</button>
      <button data-filter="unknown" id="f-unknown">Még nem tudom</button>
      <button data-filter="known" id="f-known">Tudom</button>
    </div>

    <div id="empty" class="empty" hidden></div>

    <div id="card-wrap" class="scene">
      <div id="card" class="card">
        <div class="face front">
          <span class="label">Kérdés</span>
          <span id="badge" class="badge" hidden>✓ Tudom</span>
          <p id="q"></p>
          <span class="hint">Koppints a válaszhoz · csúsztass oldalra a lapozáshoz</span>
        </div>
        <div class="face back">
          <span class="label">Válasz</span>
          <p id="a"></p>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="ghost" id="prev">◀ Előző</button>
      <button id="toggle-known" class="toggle-known">✓ Tudom</button>
      <button class="ghost" id="next">Következő ▶</button>
    </div>

    <div class="footer">
      <button class="ghost small" id="shuffle">🔀 Keverés</button>
      <button class="ghost small" id="reset">↺ Haladás nullázása</button>
    </div>
  </section>
</div>

<script src="data/categories.js" onerror="window.__catErr = true"></script>
<script>
(function () {
  const $ = s => document.querySelector(s);
  const cats = window.CATEGORIES || [];

  let cat = null;          // aktuális kategória
  let known = new Set();   // megjelölt (tudom) kártyák id-jai
  let filter = 'all';      // 'all' | 'unknown' | 'known'
  let shuffled = false;
  let order = [];          // a kártyák sorrendje (eredeti vagy kevert)
  let deck = [];           // a szűrt pakli
  let index = 0;
  let flipped = false;

  // ---------- Mentés (böngészőben, eszközönként) ----------
  function loadKnown(id) {
    try { return new Set(JSON.parse(localStorage.getItem('kartyak:known:' + id)) || []); }
    catch (e) { return new Set(); }
  }
  function saveKnown() {
    try { localStorage.setItem('kartyak:known:' + cat.id, JSON.stringify([...known])); }
    catch (e) { /* ha a tárhely nem elérhető, a haladás csak az aktuális munkamenetben marad */ }
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---------- Nézetek ----------
  function showView(name) {
    $('#home').hidden = name !== 'home';
    $('#study').hidden = name !== 'study';
    window.scrollTo(0, 0);
  }

  function renderHome() {
    const list = $('#cat-list');
    list.textContent = '';
    cats.forEach(c => {
      const k = loadKnown(c.id);
      const n = c.cards.filter(x => k.has(x.id)).length;
      const total = c.cards.length;

      const btn = document.createElement('button');
      btn.className = 'cat';

      const h = document.createElement('h2');
      h.textContent = c.title;

      const p = document.createElement('p');
      p.textContent = `${total} kártya · ${n} megtanulva`;

      const bar = document.createElement('div');
      bar.className = 'bar';
      const fill = document.createElement('div');
      fill.style.width = total ? (n / total * 100) + '%' : '0';
      bar.appendChild(fill);

      btn.append(h, p, bar);
      btn.addEventListener('click', () => openCat(c.id));
      list.appendChild(btn);
    });
  }

  function openCat(id) {
    cat = cats.find(c => c.id === id);
    known = loadKnown(id);
    filter = 'all';
    shuffled = false;
    order = cat.cards.slice();
    index = 0;
    resetFace();
    rebuild();
    showView('study');
    render();
  }

  // ---------- Pakli ----------
  function rebuild() {
    deck = order.filter(c =>
      filter === 'all' ||
      (filter === 'unknown' ? !known.has(c.id) : known.has(c.id))
    );
  }

  // ---------- Megjelenítés ----------
  function render() {
    const total = cat.cards.length;
    const nKnown = cat.cards.filter(c => known.has(c.id)).length;
    const nUnknown = total - nKnown;

    $('#study-title').textContent = cat.title;
    $('#bar').style.width = total ? (nKnown / total * 100) + '%' : '0';
    $('#progress-text').textContent = `${nKnown} / ${total} megtanulva`;

    $('#f-all').textContent = `Mind (${total})`;
    $('#f-unknown').textContent = `Még nem tudom (${nUnknown})`;
    $('#f-known').textContent = `Tudom (${nKnown})`;
    document.querySelectorAll('.seg button').forEach(b =>
      b.classList.toggle('active', b.dataset.filter === filter));

    $('#shuffle').textContent = shuffled ? '↺ Eredeti sorrend' : '🔀 Keverés';

    if (index > deck.length - 1) index = Math.max(0, deck.length - 1);

    const empty = deck.length === 0;
    $('#empty').hidden = !empty;
    $('#card-wrap').hidden = empty;
    $('.controls').hidden = empty;

    if (empty) {
      $('#counter').textContent = '0 / 0';
      $('#empty').textContent =
        filter === 'unknown' ? '🎉 Nincs több „még nem tudom” kártya!' :
        filter === 'known'   ? 'Még nincs megjelölt kártya.' :
                               'Nincs kártya.';
      return;
    }

    const c = deck[index];
    $('#counter').textContent = `${index + 1} / ${deck.length}`;
    $('#q').textContent = c.q;
    $('#a').textContent = c.a;

    const isKnown = known.has(c.id);
    $('#badge').hidden = !isKnown;
    const tk = $('#toggle-known');
    tk.textContent = isKnown ? '↺ Még nem tudom' : '✓ Tudom';
    tk.classList.toggle('undo', isKnown);

    $('#prev').disabled = index === 0;
    $('#next').disabled = index >= deck.length - 1;
  }

  // ---------- Lapozás és fordítás ----------
  function setFlip(v) {
    flipped = v;
    $('#card').classList.toggle('flipped', v);
  }
  // Kártyacserekor a kártya azonnal a kérdés oldalán legyen (animáció nélkül)
  function resetFace() {
    const card = $('#card');
    card.classList.add('instant');
    setFlip(false);
    void card.offsetWidth;
    card.classList.remove('instant');
  }

  function go(d) {
    if (!deck.length) return;
    const ni = index + d;
    if (ni < 0 || ni >= deck.length) return;
    index = ni;
    resetFace();
    render();
  }

  function flip() {
    if (!deck.length) return;
    setFlip(!flipped);
  }

  function toggleKnown() {
    const c = deck[index];
    if (!c) return;
    if (known.has(c.id)) known.delete(c.id);
    else known.add(c.id);
    saveKnown();
    if (filter !== 'all') resetFace(); // szűrt nézetben a kártya eltűnhet, ilyenkor a következő a kérdés oldalán induljon
    rebuild();
    render();
  }

  function setFilter(f) {
    filter = f;
    index = 0;
    resetFace();
    rebuild();
    render();
  }

  // ---------- Eseménykezelők ----------
  $('#back').addEventListener('click', () => { showView('home'); renderHome(); });
  $('#prev').addEventListener('click', () => go(-1));
  $('#next').addEventListener('click', () => go(1));
  $('#toggle-known').addEventListener('click', toggleKnown);
  $('#card').addEventListener('click', flip);

  document.querySelectorAll('.seg button').forEach(b =>
    b.addEventListener('click', () => setFilter(b.dataset.filter)));

  $('#shuffle').addEventListener('click', () => {
    shuffled = !shuffled;
    order = shuffled ? shuffle(cat.cards) : cat.cards.slice();
    index = 0;
    resetFace();
    rebuild();
    render();
  });

  $('#reset').addEventListener('click', () => {
    if (!confirm('Biztosan nullázod a haladást ebben a témában?')) return;
    known.clear();
    saveKnown();
    index = 0;
    resetFace();
    rebuild();
    render();
  });

  // Csúsztatás telefonon
  let sx = 0, sy = 0;
  const wrap = $('#card-wrap');
  wrap.addEventListener('touchstart', e => {
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
  }, { passive: true });
  wrap.addEventListener('touchend', e => {
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dy) < 40) go(dx < 0 ? 1 : -1);
  }, { passive: true });

  // Billentyűzet asztali géphez: ← → lapoz, Space fordít, K jelöl
  document.addEventListener('keydown', e => {
    if ($('#study').hidden) return;
    if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === ' ') { e.preventDefault(); flip(); }
    else if (e.key === 'k' || e.key === 'K') toggleKnown();
  });

  // ---------- Indítás ----------
  showView('home');
  renderHome();
  if (!cats.length) {
    const msg = document.createElement('div');
    msg.className = 'empty';
    msg.textContent = window.__catErr
      ? 'Hiba: a data/categories.js nem töltődött be. Ellenőrizd, hogy a data mappa az index.html mellett van, és a fájl feltöltése sikerült.'
      : 'Nincs kategória a data/categories.js fájlban.';
    $('#cat-list').appendChild(msg);
  }

  // Offline működés: service worker csak http(s) felületen regisztrálódik (pl. GitHub Pages)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
