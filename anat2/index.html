<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mozgásrendszer – Tanulókártyák</title>
<style>
  :root {
    --paper: #efe5d3;
    --paper-deep: #e4d7bf;
    --ink: #3a3633;
    --card: #3d3a37;
    --cream: #f3ead8;
    --muted-cream: #cfc4ad;
    --terracotta: #b8583f;
    --terracotta-soft: #d98b72;
    --sage: #7f8a72;
    --mustard: #c9a25a;
    --shadow: rgba(60, 45, 30, 0.22);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    justify-content: center;
    padding: env(safe-area-inset-top, 0px) 12px env(safe-area-inset-bottom, 0px);
    min-height: 100vh;
  }

  .app {
    position: relative;
    width: 100%;
    max-width: 460px;
    min-height: 100vh;
    overflow: hidden;
    padding: 22px 18px 32px;
  }

  .deco { position: absolute; pointer-events: none; border-radius: 50%; z-index: 0; }
  .deco.a { width: 260px; height: 260px; top: -110px; right: -120px; border: 2px solid var(--terracotta-soft); opacity: 0.8; }
  .deco.b { width: 180px; height: 180px; top: 40px; right: -70px; background: var(--terracotta); opacity: 0.18; }
  .deco.c { width: 120px; height: 120px; bottom: 60px; left: -60px; border: 2px dashed var(--sage); opacity: 0.6; }

  .content { position: relative; z-index: 1; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: "Trebuchet MS", Verdana, sans-serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--ink);
    padding: 4px 2px 14px;
  }
  .icon-btn { background: none; border: none; color: var(--ink); font-size: 22px; cursor: pointer; padding: 6px 8px; line-height: 1; }

  .heading { margin: 6px 2px 4px; }
  .eyebrow {
    font-family: "Trebuchet MS", Verdana, sans-serif;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--terracotta);
  }
  .heading h1 { font-size: 26px; font-weight: normal; line-height: 1.2; margin-top: 4px; }
  .heading h1 strong { font-weight: bold; }

  .view { display: none; }
  .view.active { display: block; }

  /* ---------- category selection ---------- */
  .category-list { display: flex; flex-direction: column; gap: 16px; margin-top: 26px; }
  .cat-card {
    position: relative;
    background: var(--card);
    color: var(--cream);
    border-radius: 14px;
    padding: 20px 20px 18px;
    cursor: pointer;
    box-shadow: 0 8px 18px var(--shadow);
    border: none;
    text-align: left;
    width: 100%;
    font-family: inherit;
    transition: transform 0.15s ease;
    overflow: hidden;
  }
  .cat-card:active { transform: scale(0.98); }
  .cat-card::before {
    content: "";
    position: absolute;
    right: -30px; top: -30px;
    width: 110px; height: 110px;
    border-radius: 50%;
    border: 1.5px solid var(--terracotta-soft);
    opacity: 0.5;
  }
  .cat-card.empty { background: var(--paper-deep); color: var(--ink); box-shadow: none; cursor: default; }
  .cat-card.empty:active { transform: none; }
  .cat-card.empty::before { border-color: var(--sage); }
  .cat-num { font-family: "Trebuchet MS", Verdana, sans-serif; font-size: 12px; letter-spacing: 0.12em; color: var(--mustard); text-transform: uppercase; }
  .cat-card.empty .cat-num { color: var(--sage); }
  .cat-title { font-size: 20px; margin: 6px 0 8px; line-height: 1.25; color: var(--cream); }
  .cat-card.empty .cat-title { color: var(--ink); }
  .cat-desc { font-size: 14px; line-height: 1.5; color: var(--muted-cream); }
  .cat-card.empty .cat-desc { color: var(--sage); }
  .cat-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    font-family: "Trebuchet MS", Verdana, sans-serif;
    font-size: 12px;
    color: var(--muted-cream);
  }
  .cat-card.empty .cat-foot { color: var(--sage); }
  .cat-arrow { font-size: 26px; color: var(--terracotta-soft); }

  /* ---------- deck view ---------- */
  .deck-head { margin-top: 6px; }
  .deck-head h2 { font-size: 21px; font-weight: normal; margin-top: 4px; line-height: 1.25; }

  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "Trebuchet MS", Verdana, sans-serif;
    font-size: 12px;
    color: var(--ink);
    margin: 18px 2px 8px;
  }
  .progress { height: 6px; background: var(--paper-deep); border-radius: 6px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: var(--terracotta); transition: width 0.3s ease; }

  .scene { perspective: 1200px; margin-top: 18px; height: 360px; }
  .flipper {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.55s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
    cursor: pointer;
  }
  .flipper.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    padding: 24px 22px;
    box-shadow: 0 10px 22px var(--shadow);
    overflow: hidden;
  }
  .face.front { background: var(--card); color: var(--cream); }
  .face.back {
    background: var(--cream);
    color: var(--ink);
    transform: rotateY(180deg);
    border: 1.5px solid var(--paper-deep);
  }
  .face::after {
    content: "";
    position: absolute;
    right: -50px; bottom: -50px;
    width: 150px; height: 150px;
    border-radius: 50%;
    border: 1.5px solid var(--terracotta-soft);
    opacity: 0.35;
    pointer-events: none;
  }
  .face-label {
    font-family: "Trebuchet MS", Verdana, sans-serif;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .face.front .face-label { color: var(--mustard); }
  .face.back .face-label { color: var(--terracotta); }
  .face-text { font-size: 19px; line-height: 1.45; overflow-y: auto; flex: 1; padding-right: 4px; }
  .face.back .face-text { font-size: 17px; }
  .face-hint {
    font-family: "Trebuchet MS", Verdana, sans-serif;
    font-size: 12px;
    color: var(--muted-cream);
    text-align: right;
    margin-top: 10px;
  }
  .face.back .face-hint { color: var(--sage); }

  .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; gap: 10px; }
  .nav-btn {
    background: none;
    border: 1.5px solid var(--ink);
    color: var(--ink);
    font-family: "Trebuchet MS", Verdana, sans-serif;
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .nav-btn.arrow { border: none; color: var(--terracotta); font-size: 30px; padding: 0 6px; line-height: 1; }
  .nav-btn.arrow:disabled { color: var(--ink); }

  .mark-row { display: flex; gap: 10px; margin-top: 16px; }
  .mark-btn {
    flex: 1;
    font-family: "Trebuchet MS", Verdana, sans-serif;
    font-size: 13px;
    padding: 11px 10px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    color: var(--cream);
  }
  .mark-btn.know { background: var(--sage); }
  .mark-btn.again { background: var(--terracotta); }
  .mark-btn.active { box-shadow: inset 0 0 0 2px var(--cream), 0 0 0 2px var(--ink); }

  .mini-actions {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 16px;
    font-family: "Trebuchet MS", Verdana, sans-serif;
    font-size: 13px;
  }
  .link-btn {
    background: none;
    border: none;
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    font-family: inherit;
    font-size: inherit;
    padding: 4px;
  }

  .done-box {
    display: none;
    margin-top: 18px;
    background: var(--paper-deep);
    border-radius: 14px;
    padding: 18px;
    text-align: center;
    font-size: 15px;
    line-height: 1.5;
  }
  .done-box.show { display: block; }
  .done-box strong { color: var(--terracotta); font-weight: bold; }

  footer {
    margin-top: 28px;
    text-align: center;
    font-family: "Trebuchet MS", Verdana, sans-serif;
    font-size: 11px;
    color: var(--sage);
    letter-spacing: 0.06em;
  }

  @media (prefers-reduced-motion: reduce) {
    .flipper, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="deco a"></div>
  <div class="deco b"></div>
  <div class="deco c"></div>

  <div class="content">
    <div class="topbar">
      <span>Mozgásrendszer</span>
      <span>☰</span>
    </div>

    <!-- HOME: category selection -->
    <section id="homeView" class="view active">
      <div class="heading">
        <div class="eyebrow">Tanulókártyák</div>
        <h1>Válassz <strong>témakört</strong></h1>
      </div>
      <div class="category-list" id="categoryList"></div>
      <footer>Offline · csak a böngészőben fut</footer>
    </section>

    <!-- DECK: cards -->
    <section id="deckView" class="view">
      <div class="topbar">
        <button class="icon-btn" id="backHome" aria-label="Vissza">←</button>
        <span id="deckTopLabel"></span>
        <span style="width:38px"></span>
      </div>

      <div class="deck-head">
        <div class="eyebrow" id="deckEyebrow"></div>
        <h2 id="deckTitle"></h2>
      </div>

      <div class="progress-row">
        <span id="counter">1 / 1</span>
        <span id="knownCount">Tudom: 0</span>
      </div>
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>

      <div class="scene">
        <div class="flipper" id="flipper" role="button" tabindex="0" aria-label="Kártya megfordítása">
          <div class="face front">
            <div class="face-label">Kérdés</div>
            <div class="face-text" id="frontText"></div>
            <div class="face-hint">Koppints a válaszhoz</div>
          </div>
          <div class="face back">
            <div class="face-label">Válasz</div>
            <div class="face-text" id="backText"></div>
            <div class="face-hint">Koppints vissza</div>
          </div>
        </div>
      </div>

      <div class="mark-row">
        <button class="mark-btn again" id="markAgain">Gyakorlom ↻</button>
        <button class="mark-btn know" id="markKnow">Tudom ✓</button>
      </div>

      <div class="controls">
        <button class="nav-btn arrow" id="prevBtn" aria-label="Előző">←</button>
        <button class="nav-btn" id="shuffleBtn">Keverés</button>
        <button class="nav-btn arrow" id="nextBtn" aria-label="Következő">→</button>
      </div>

      <div class="mini-actions">
        <button class="link-btn" id="restartBtn">Újrakezdés</button>
        <button class="link-btn" id="practiceBtn">Csak a „gyakorlom” kártyák</button>
      </div>

      <div class="done-box" id="doneBox">
        <strong>Kész a kör!</strong><br>
        <span id="doneText"></span>
      </div>
    </section>
  </div>
</div>

<script>
  const CATEGORIES = [
    {
      id: 1,
      title: "Csontvázrendszer",
      desc: "A csontváz felépítése, feladatai, a csontszövet, a csontok alakja, ízületek, síkok és súlyvonal.",
      cards: [
        { q: "Mi a bilaterális szimmetria?", a: "A test jobb és bal oldala alapvetően egymás tükörképe. A középsík (median sagittalis sík) osztja jobb és bal félre." },
        { q: "Mi a szelvényezettség (szegmentáció)?", a: "A test bizonyos részei hasonló, ismétlődő szakaszokból, szelvényekből épülnek fel." },
        { q: "Adj példát a szelvényezettségre!", a: "Gerincoszlop csigolyái, a bordák elhelyezkedése, a törzs izmainak egyes rétegei, a gerincvelői idegek szegmentális elrendeződése." },
        { q: "Mi a mozgásrendszer feladata?", a: "Lehetővé teszi a test helyzetének megváltoztatását, a helyváltoztatást és a testtartás fenntartását." },
        { q: "Mi tartozik a passzív mozgásrendszerhez?", a: "Csontok, ízületek, ízületi szalagok és porcok. Feladata: a test támasztása, védelme és a mozgás kereteinek biztosítása." },
        { q: "Mi tartozik az aktív mozgásrendszerhez?", a: "Vázizmok és izmok inai. Az izom-összehúzódással létrehozza a mozgást, fenntartja a testtartást és stabilizálja az ízületeket." },
        { q: "Melyik rész hozza létre a mozgást: az aktív vagy a passzív?", a: "Az aktív rész. A passzív rész a mozgás kereteit adja." },
        { q: "Hány csontból áll egy felnőtt csontváza?", a: "Általában 206 csontból." },
        { q: "Sorold fel a csontváz hat feladatát!", a: "Támasztás, védelem, mozgás, vérképzés, ásványianyag-raktározás, energiaraktározás." },
        { q: "Mely részek alkotják a tengelyvázat?", a: "A koponya, a gerincoszlop és a mellkas." },
        { q: "Mi a csontszövet szerves állománya?", a: "Kb. 1/3 részt tesz ki, főként kollagénrostokból áll. Rugalmasságot és hajlékonyságot ad, és segít megelőzni a csont törékenységét." },
        { q: "Mi a csontszövet szervetlen állománya?", a: "Kb. 2/3 részt tesz ki, főként kalcium- és foszfátsókból áll. Keménységet és szilárdságot biztosít." },
        { q: "Mi az osteoblast?", a: "Csontépítő sejt, új csontállományt termel." },
        { q: "Mi az osteoclast?", a: "Csontbontó sejt, lebontja a régi csontállományt." },
        { q: "Mi az osteocyta?", a: "Érett csontsejt, fenntartja a csontszövetet." },
        { q: "Mi a különbség a tömör és a szivacsos csontállomány között?", a: "A tömör (substantia compacta) kemény, sűrű, nagy teherbírású. A szivacsos (substantia spongiosa) gerendázatos, könnyebb, a csont belsejében található." },
        { q: "Mi a csonthártya (periosteum)?", a: "A csont külső felszínét borító kötőszövetes hártya. Vérereket és idegeket tartalmaz." },
        { q: "Mi a velőüreg (cavitas medullaris)?", a: "A hosszú csontok középső részében található üreg." },
        { q: "Mi a diaphysis?", a: "A csöves csont középső, hosszú szakasza, a csonttest." },
        { q: "Mi a metaphysis?", a: "A csonttest és a csontvég közötti átmeneti terület." },
        { q: "Mi a növekedési porc (epiphysisporc) szerepe?", a: "Gyermekkorban a hosszanti növekedés helye. Felnőttkorban elcsontosodik, helyén epiphysisvonal marad." },
        { q: "Adj példát hosszú (csöves) csontra!", a: "Combcsont, felkarcsont, sípcsont. Hosszúságuk nagyobb, mint szélességük és vastagságuk." },
        { q: "Adj példát rövid csontra!", a: "Kéztőcsontok, lábtőcsontok. Hosszúságuk, szélességük és vastagságuk közel azonos." },
        { q: "Adj példát lapos csontra!", a: "Lapocka, szegycsont, bordák, koponyacsontok. Védő és izomtapadási szerepük van." },
        { q: "Adj példát szabálytalan csontra!", a: "Csigolyák, egyes arckoponyacsontok. Bonyolult, változatos alakúak." },
        { q: "Mi a szezámcsont, és mi a példája?", a: "Inakban kialakuló kis csont, amely védi az inat és javítja az izom erőkarját. Példa: térdkalács (patella)." },
        { q: "Mi jellemzi a folytonos csontösszeköttetéseket (synarthrosis)?", a: "A csontokat kötőszövet vagy porc köti össze. Nincs valódi ízületi rés." },
        { q: "Adj példát syndesmosisra!", a: "A sípcsont és a szárkapocscsont közötti összeköttetés." },
        { q: "Adj példát sutura típusú összeköttetésre!", a: "A koponyacsontok között." },
        { q: "Adj példát synchondrosisra!", a: "Az első bordaporc és a szegycsont közötti porcos kapcsolat." },
        { q: "Adj példát symphysisre!", a: "A csigolyatestek között, illetve a szeméremcsontok között." },
        { q: "Mi jellemzi a megszakított összeköttetéseket (diarthrosis)?", a: "Valódi ízületek, ízületi réssel. A csontok egymáshoz képest elmozdulhatnak." },
        { q: "Sorold fel a synoviális ízület hat fő alkotórészét!", a: "Ízületi fej, ízületi vápa, ízületi porc, ízületi tok, ízületi üreg, ízületi folyadék (synovia)." },
        { q: "Mi a synovia feladata?", a: "Kenést és tápanyagellátást biztosít az ízületi porcnak." },
        { q: "Mi az ízületi tok két rétege?", a: "Külső rostos réteg (membrana fibrosa) és belső ízületi belhártya (membrana synovialis), amely az ízületi folyadékot termeli." },
        { q: "Sorold fel a synoviális ízület járulékos elemeit!", a: "Ízületi szalagok, ízületi korongok, meniscusok, ízületi ajkak (labrum), nyáktömlők (bursa), ínhüvelyek." },
        { q: "Milyen mozgásokat végez az egytengelyű ízület? Példa?", a: "Hajlítás (flexio) és nyújtás (extensio). Példa: könyökízület, ujjpercek közötti ízületek." },
        { q: "Milyen mozgásokat végez a kéttengelyű ízület? Példa?", a: "Hajlítás, nyújtás, távolítás (abductio) és közelítés (adductio). Példa: csuklóízület, hüvelykujj nyeregízülete." },
        { q: "Milyen mozgásokat végez a háromtengelyű ízület? Példa?", a: "Hajlítás, nyújtás, távolítás, közelítés és forgatás (rotatio). Példa: váll- és csípőízület." },
        { q: "Mi az egyszerű ízület (articulatio simplex)?", a: "Olyan ízület, amelyben két csont vesz részt. Példa: vállízület." },
        { q: "Mi a komplex ízület (articulatio complexa)? Példa?", a: "Az ízületi üregben porcos korong vagy meniscus is található. Példa: térdízület." },
        { q: "Mi a kapcsolat az ízületek stabilitása és mobilitása között?", a: "Általában fordított: a nagyobb mobilitás gyakran kisebb stabilitással, a nagyobb stabilitás kisebb mozgásterjedelemmel jár." },
        { q: "Mit jelent az ízületről-ízületre elv?", a: "Az ízületek felváltva igényelnek mobilitást vagy stabilitást. Például a bokaízület mobilitást, a térdízület stabilitást igényel. Ha egy ízület nem látja el feladatát, a szomszédos ízületek túlterhelődhetnek." },
        { q: "Melyik sík osztja a testet jobb és bal oldalra? Milyen mozgások jellemzik?", a: "A sagittalis (nyílirányú) sík. Jellemző mozgások: flexio és extensio. Példa: guggolás, könyökhajlítás." },
        { q: "Melyik sík osztja a testet elülső és hátulsó részre? Milyen mozgások?", a: "A frontalis (homloksík, coronalis sík). Jellemző mozgások: abductio, adductio, oldalra hajlítás. Példa: karemelés oldalra." },
        { q: "Melyik sík osztja a testet felső és alsó részre? Milyen mozgások?", a: "A transversalis (vízszintes) sík. Jellemző mozgások: rotatio, horizontális abductio és adductio. Példa: törzsfordítás." },
        { q: "Melyik tengely körül történnek a sagittalis síkbeli mozgások?", a: "A haránttengely (transversalis tengely), amely jobbról balra halad." },
        { q: "Melyik tengely körül történnek a frontalis síkbeli mozgások?", a: "A nyílirányú tengely (sagittalis tengely), amely elölről hátrafelé halad." },
        { q: "Melyik tengely körül történnek a transversalis síkbeli mozgások?", a: "A hossztengely (longitudinalis tengely), amely függőlegesen halad a test hosszában." },

      desc: "Stretching, mobilitás és flexibilitás, AROM és PROM, fascia, SMR és az idegrendszeri nyújtási mechanizmusok.",
      cards: [
        { q: "Mi a stretching?", a: "Az izmok és a környező szövetek nyújtása a mozgásterjedelem növelése vagy fenntartása érdekében." },
        { q: "Mi a mobilizáció?", a: "Az ízületek és a környező szövetek mozgásterjedelmét fejlesztő, aktív vagy passzív mozgás." },
        { q: "Mi a különbség a stretching és a mobilizáció között?", a: "A stretching főként a lágyrészek nyújtására, a mobilizáció az ízületi mozgásterjedelem fejlesztésére irányul." },
        { q: "Mit jelent a mobilitás?", a: "Az ízület aktív, kontrollált mozgásterjedelme." },
        { q: "Mit jelent a flexibilitás?", a: "Az izmok és más lágyrészek nyújthatósága, megnyújthatósága." },
        { q: "Milyen tényezők befolyásolják a mobilitást és flexibilitást?", a: "Izom- és kötőszöveti tulajdonságok, ízületi felépítés, idegrendszer, életkor, hőmérséklet és aktivitás." },
        { q: "Mi az AROM?", a: "Active Range of Motion: aktív mozgásterjedelem, amelyet saját izomerővel végzünk." },
        { q: "Mi a PROM?", a: "Passive Range of Motion: passzív mozgásterjedelem, amelyet külső erő vagy segítség hoz létre." },
        { q: "Mi a különbség az AROM és a PROM között?", a: "AROM esetén saját izmaink mozgatják az ízületet, PROM esetén külső erő végzi a mozgást." },
        { q: "Hogyan hat a tartós inaktivitás az izmokra?", a: "Izomsorvadást, erőcsökkenést, merevséget és a mozgástartomány beszűkülését okozhatja." },
        { q: "Mi történhet a szarkomerekkel tartós immobilizáció során?", a: "A tartósan rövid helyzetben tartott izomban csökkenhet a soros szarkomerek száma." },
        { q: "Hogyan változhat a kollagén tartós inaktivitás hatására?", a: "A kötőszövet merevebbé válhat, és csökkenhet a szövetek rugalmassága." },
        { q: "Miért nem elegendő önmagában a nyújtás a beszűkült mozgásterjedelem javításához?", a: "Mert a beszűkülés oka lehet izomgyengeség, ízületi korlátozottság vagy idegrendszeri tényező is." },
        { q: "Milyen módszerek segíthetik a mobilitás fejlesztését?", a: "Dinamikus mobilizáció, aktív nyújtás, erősítés, kontrollált ízületi mozgások és SMR." },
        { q: "Mi a fascia?", a: "A test egészét átszövő kötőszövetes hálózat, amely körülveszi és összekapcsolja az izmokat és más struktúrákat." },
        { q: "Mi a fascia szerepe?", a: "Támaszt, összeköttetést és erőátvitelt biztosít, valamint részt vesz a mozgásban és a szövetek mechanikai működésében." },
        { q: "Mi az SMR?", a: "Self-Myofascial Release: önmasszázs hengerrel vagy más eszközzel, amely a lágyrészek kezelését célozza." },
        { q: "Milyen hatása lehet az SMR-nek?", a: "Rövid távon javíthatja a mozgásterjedelmet és csökkentheti a merevségérzetet." },
        { q: "Miért hasznos a megnyújtott helyzetben végzett erősítés?", a: "Erősíti az izmokat nagyobb izomhossznál, és segítheti az aktív mozgásterjedelem fejlesztését." },
        { q: "Mi az a soros szarkomer-adaptáció?", a: "Az izomrostban a szarkomerek száma soros irányban növekedhet, ami hozzájárulhat a hosszabb izomhosszhoz." },
        { q: "Mi a reciprok gátlás?", a: "Az agonista izom összehúzódása idegrendszeri úton csökkentheti az antagonista izom aktivitását." },
        { q: "Mondj példát a reciprok gátlásra!", a: "Térdnyújtáskor a combfeszítő izmok aktiválódnak, miközben a combhajlítók aktivitása csökkenhet." },
        { q: "Mi a nyújtási vagy miotatikus reflex?", a: "Az izom gyors megnyúlására bekövetkező reflexes összehúzódás." },
        { q: "Mi az izomorsó szerepe?", a: "Érzékeli az izom hosszának változását és a megnyúlás sebességét." },
        { q: "Mi az autogén gátlás?", a: "Az izom saját feszüléséhez kapcsolódó idegrendszeri folyamat, amely csökkentheti ugyanazon izom aktivitását." },
        { q: "Mi a Golgi-féle ínorsó szerepe?", a: "Érzékeli az izom-ín rendszer feszülését, és információt küld az idegrendszernek." },
        { q: "Hogyan kapcsolódik az autogén gátlás a paścimottānāsanához?", a: "A tartós, kontrollált előrehajlás során az izom-ín rendszer feszülése és az idegrendszeri szabályozás is befolyásolhatja a nyújtásérzetet." },
        { q: "Mi a ko-kontrakció?", a: "Az agonista és antagonista izmok egyidejű összehúzódása." },
        { q: "Miért fontos a ko-kontrakció guggolás közben?", a: "Segíti az ízületek stabilizálását és a mozgás kontrollját." },
        { q: "Mi a különbség a mobilitás és a flexibilitás között?", a: "A flexibilitás a lágyrészek nyújthatósága, a mobilitás pedig az aktív, kontrollált ízületi mozgásképesség." }
      ]
    }
  ];

  // ---------- state ----------
  let catIndex = 0;
  let order = [];
  let pos = 0;
  let known = new Set();
  let practiceOnly = false;
  let flipped = false;

  const $ = (id) => document.getElementById(id);

  function showView(name) {
    $("homeView").classList.toggle("active", name === "home");
    $("deckView").classList.toggle("active", name === "deck");
    window.scrollTo(0, 0);
  }

  // ---------- home ----------
  function renderHome() {
    const list = $("categoryList");
    list.innerHTML = "";
    CATEGORIES.forEach((cat, i) => {
      const empty = cat.cards.length === 0;
      const btn = document.createElement("button");
      btn.className = "cat-card" + (empty ? " empty" : "");
      btn.disabled = empty;
      btn.innerHTML = `
        <div class="cat-num">Témakör ${cat.id}</div>
        <div class="cat-title"></div>
        <div class="cat-desc"></div>
        <div class="cat-foot">
          <span></span>
          <span class="cat-arrow">${empty ? "" : "→"}</span>
        </div>`;
      btn.querySelector(".cat-title").textContent = cat.title;
      btn.querySelector(".cat-desc").textContent = cat.desc;
      btn.querySelector(".cat-foot span").textContent = empty ? "Hamarosan" : cat.cards.length + " kártya";
      if (!empty) btn.addEventListener("click", () => openCategory(i));
      list.appendChild(btn);
    });
  }

  // ---------- deck ----------
  function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildOrder() {
    const all = CATEGORIES[catIndex].cards.map((_, i) => i);
    order = practiceOnly ? all.filter(i => !known.has(i)) : all;
    if (order.length === 0) order = all;
    pos = 0;
  }

  function openCategory(i) {
    catIndex = i;
    known = new Set();
    practiceOnly = false;
    buildOrder();
    const cat = CATEGORIES[i];
    $("deckTopLabel").textContent = "Témakör " + cat.id;
    $("deckEyebrow").textContent = "Témakör " + cat.id;
    $("deckTitle").textContent = cat.title;
    showView("deck");
    setFlipped(false, true);
    renderCard();
  }

  function setFlipped(v, instant) {
    flipped = v;
    const f = $("flipper");
    if (instant) f.style.transition = "none";
    f.classList.toggle("flipped", v);
    if (instant) {
      requestAnimationFrame(() => requestAnimationFrame(() => { f.style.transition = ""; }));
    }
  }

  function currentCard() {
    return CATEGORIES[catIndex].cards[order[pos]];
  }

  function renderCard() {
    const total = order.length;
    const cat = CATEGORIES[catIndex];
    const card = currentCard();
    $("frontText").textContent = card.q;
    $("backText").textContent = card.a;
    $("counter").textContent = (pos + 1) + " / " + total;
    $("knownCount").textContent = "Tudom: " + known.size + " / " + cat.cards.length;
    $("progressFill").style.width = ((known.size / cat.cards.length) * 100) + "%";
    $("prevBtn").disabled = pos === 0;
    $("nextBtn").disabled = pos === total - 1;

    const idx = order[pos];
    $("markKnow").classList.toggle("active", known.has(idx));
    $("markAgain").classList.toggle("active", !known.has(idx));

    $("doneBox").classList.remove("show");
    $("practiceBtn").textContent = practiceOnly ? "Mind a kártyák" : "Csak a „gyakorlom” kártyák";
  }

  function goTo(newPos) {
    if (newPos < 0 || newPos >= order.length) return;
    pos = newPos;
    setFlipped(false);
    setTimeout(renderCard, 120);
  }

  function next() {
    if (pos < order.length - 1) goTo(pos + 1);
    else showDoneIfNeeded();
  }

  function prev() { goTo(pos - 1); }

  function showDoneIfNeeded() {
    const total = CATEGORIES[catIndex].cards.length;
    const left = total - known.size;
    $("doneText").textContent = left === 0
      ? "Minden kártyát tudsz ebben a témakörben."
      : "Még " + left + " kártya van, amit gyakorolnod kell.";
    $("doneBox").classList.add("show");
  }

  function markKnow() {
    const idx = order[pos];
    if (known.has(idx)) known.delete(idx); else known.add(idx);
    renderCard();
    if (known.size === CATEGORIES[catIndex].cards.length) showDoneIfNeeded();
  }

  function markAgain() {
    known.delete(order[pos]);
    renderCard();
  }

  function shuffleDeck() {
    const all = CATEGORIES[catIndex].cards.map((_, i) => i);
    const base = practiceOnly ? all.filter(i => !known.has(i)) : all;
    order = shuffleArray(base.length ? base : all);
    pos = 0;
    setFlipped(false);
    renderCard();
  }

  function restart() {
    known = new Set();
    practiceOnly = false;
    buildOrder();
    setFlipped(false);
    renderCard();
  }

  function togglePractice() {
    practiceOnly = !practiceOnly;
    buildOrder();
    setFlipped(false);
    renderCard();
  }

  // ---------- events ----------
  $("backHome").addEventListener("click", () => showView("home"));
  $("flipper").addEventListener("click", () => setFlipped(!flipped));
  $("flipper").addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setFlipped(!flipped); }
  });
  $("nextBtn").addEventListener("click", next);
  $("prevBtn").addEventListener("click", prev);
  $("markKnow").addEventListener("click", markKnow);
  $("markAgain").addEventListener("click", markAgain);
  $("shuffleBtn").addEventListener("click", shuffleDeck);
  $("restartBtn").addEventListener("click", restart);
  $("practiceBtn").addEventListener("click", togglePractice);

  document.addEventListener("keydown", (e) => {
    if (!$("deckView").classList.contains("active")) return;
    if (e.key === "ArrowRight") next();
    else if (e.key === "ArrowLeft") prev();
    else if (e.key === " ") { e.preventDefault(); setFlipped(!flipped); }
  });

  let touchX = null;
  const scene = document.querySelector(".scene");
  scene.addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
  scene.addEventListener("touchend", (e) => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (Math.abs(dx) > 50) { dx < 0 ? next() : prev(); }
  });

  renderHome();
</script>
</body>
</html>
